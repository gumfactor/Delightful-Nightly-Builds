<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morning Briefing — 2026-06-22</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --border: #334155;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --green: #22c55e;
  --red: #ef4444;
  --blue: #3b82f6;
  --yellow: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 1.5rem; }
h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
.subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; }
.card h2 { font-size: 1rem; margin-bottom: 0.75rem; }
.ai-card { border-color: var(--blue); margin-bottom: 1rem; }
.ai-text { color: var(--text); line-height: 1.7; font-size: 0.9rem; white-space: pre-wrap; }
table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
th { color: var(--muted); font-weight: 600; text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); }
td { padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--border); word-break: break-word; }
tr:last-child td { border-bottom: none; }
.badge { padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
.health-active { background: rgba(34,197,94,0.2); color: var(--green); }
.health-recent { background: rgba(59,130,246,0.2); color: var(--blue); }
.health-stale  { background: rgba(239,68,68,0.2); color: var(--red); }
.health-unknown{ background: rgba(148,163,184,0.2); color: var(--muted); }
.text-green { color: var(--green); font-weight: 600; }
.text-red   { color: var(--red); font-weight: 600; }
.text-gray  { color: var(--muted); }
.score-high { color: var(--green); font-weight: 600; }
.score-mid  { color: var(--yellow); }
.score-low  { color: var(--muted); }
.stat-row { display: flex; gap: 1.5rem; margin-bottom: 0.75rem; }
.stat { font-size: 1.25rem; font-weight: 700; }
.stat-label { font-size: 0.75rem; color: var(--muted); }
.chart-wrap { height: 160px; margin-bottom: 0.75rem; }
.error { color: var(--red); font-size: 0.875rem; }
.empty-msg { color: var(--muted); font-size: 0.875rem; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>Morning Briefing</h1>
<p class="subtitle">2026-06-22</p>

<div class="grid">
<section class="card">
<h2>📁 GitHub Activity</h2>
<p class="error">⚠ GITHUB_TOKEN not set</p>
<div class="stat-row"><div><div class="stat">0</div><div class="stat-label">active repos</div></div><div><div class="stat">0</div><div class="stat-label">stale repos</div></div><div><div class="stat">0</div><div class="stat-label">open PRs</div></div></div>
<p class="empty-msg">No recent repository activity</p>
</section>
<section class="card">
<h2>💹 Portfolio Pulse</h2>
<div class="stat-row"><div><div class="stat text-green">0</div><div class="stat-label">up</div></div><div><div class="stat text-gray">0</div><div class="stat-label">flat</div></div><div><div class="stat text-red">0</div><div class="stat-label">down</div></div></div>
<div class="chart-wrap"><canvas id="portfolioChart"></canvas></div>
<p class="empty-msg">No portfolio data</p>
</section>
<section class="card">
<h2>⛅ Weather Windows</h2>
<p class="error">⚠ HTTP Error 403: Forbidden</p>
<p class="empty-msg">No weather data</p>
</section>

</div>
<script>
const ctx = document.getElementById('portfolioChart');
if (ctx) {
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: [],
      datasets: [{
        label: 'Change %',
        data: [],
        backgroundColor: [],
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e293b' } },
        y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#334155' } }
      }
    }
  });
}
</script>
</body>
</html>
